[package]
name = "cxl-sort"
version = "0.1.0"
edition = "2024"
default-run = "cxl-sort"

[dependencies]
shm_cxl = { path = "../../../shm-cxl" }
clap = { version = "4.6.1", features = ["derive"] }
mpi = { version = "0.8.2", features = ["derive"], optional = true }

[features]
mpi = ["dep:mpi"]

[[bin]]
name = "cxl-sort-mpi"
path = "src/mpi_main.rs"
required-features = ["mpi"]
